name: Daily CBB sheet

on:
  schedule:
    - cron: "0 14 * * *"     # ~6 AM PT: grade yesterday, build today's sheet
    - cron: "0 16 * * *"     # ~8 AM PT (extra tries: Torvik sometimes blocks GitHub servers)
    - cron: "0 18 * * *"     # ~10 AM PT
    - cron: "30 21 * * *"   # ~1:30 PM Pacific: rerun to add Sasser (posts around midday CT)
  workflow_dispatch: {}      # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: daily-sheet
  cancel-in-progress: false

jobs:
  # Torvik blocks some GitHub server addresses, and each job gets a different machine,
  # so try it from several at once and keep any page that got through.
  torvik:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        try: [1, 2, 3, 4, 5, 6]
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Fetch Torvik
        run: python tools/fetch_torvik.py
      - uses: actions/upload-artifact@v4
        with:
          name: torvik-${{ matrix.try }}
          path: cache/
          retention-days: 1

  run:
    needs: torvik
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Los_Angeles   # dates and tip-off times in Pacific
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Get Torvik page from whichever try got through
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: torvik-*
          merge-multiple: true
          path: cache/
      - name: Run
        run: |
          python cbb_consensus.py 2>&1 | tee run_log.txt
          python make_mobile.py || true
      - name: Save results back to the repository
        run: |
          mkdir -p output && cp run_log.txt output/last_run_log.txt
          git config user.name "cbb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output
          git commit -m "Daily run $(date +'%Y-%m-%d %H:%M %Z')" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Keep the downloaded pages for troubleshooting (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: cache/
          retention-days: 3
